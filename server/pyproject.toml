[project]
name = "botsapp"
version = "0.1.0"
description = "WhatsApp MCP Server using WAHA bridge"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.0.2",
    "uvicorn[standard]>=0.28.0",
    "aiosqlite>=0.20.0",
    "aiohttp>=3.9.1",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "aiosql>=12.0",
    "starlette>=0.52.0",
    "python-multipart>=0.0.9",
    # Country-flag column on the admin UI's Chats tab: derives an ISO
    # region from a chat's E.164 jid via the same calling-code table
    # libphonenumber uses — no network call, no API key.
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    # aresponses, not aioresponses — it runs a real local aiohttp test
    # server instead of monkeypatching aiohttp's internal response
    # objects, so it doesn't break every time aiohttp changes its
    # internal API.
    "aresponses>=3.0.0",
    "ruff>=0.6",
    "pytest-cov>=5.0",
    "ty>=0.0.78",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botsapp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff]
line-length = 100

[tool.ty.environment]
python-version = "3.13"

[tool.ty.terminal]
error-on-warning = false

[tool.ty.src]
include = ["src", "tests"]

# test_admin.py monkeypatches botsapp.state's module-level globals
# (state.db, state.bridge — typed `X | None` for real code) with AsyncMock
# instances, then reads them back through `state.db.foo.return_value`/
# `.assert_awaited_once_with(...)` in a separate test function. That's the
# same pattern conftest.py's fixtures use for tools.py's tests, but here
# it's read back through the Optional-typed module attribute itself rather
# than a locally-typed fixture variable — no flow-narrowing crosses that
# module-attribute/function boundary, and DatabaseManager/Bridge genuinely
# don't have Mock-only attributes like `.return_value`. Relax rather than
# force real code down to `Any` or add `assert x is not None` at 50 call
# sites for a false alarm inherent to this mocking style.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "warn"
invalid-assignment = "warn"
