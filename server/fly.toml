# Fly app for mcp-server + admin-ui — see docs/decisions/0013, 0028. Both run
# as separate processes inside this one Machine (server/start.sh), sharing the
# two volumes below. Only port 8000 is ever declared as a public service —
# but since 0028, that's Caddy (see server/Caddyfile), fronting both
# processes on this one port: /admin/* reaches admin-ui (still only over
# Fly's private 6PN networking directly, e.g. `fly proxy`, never via a port
# of its own), everything else reaches mcp-server.
#
# App name/region are placeholders — set at `fly launch`/`fly apps create`
# time; `app` here must match whatever name actually got created.
app = "botsapp"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "./start.sh"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "botsapp_data"
  destination = "/app/data"
  initial_size = "1gb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]

[env]
  # DATABASE_URL points at the mount above — same path docker-compose.yml
  # already uses locally. There's no MEDIA_DIR: get_media() fetches media
  # straight from WAHA (which keeps its own persistent copy) rather than
  # caching it locally — see docs/decisions/0007-sqlite-for-metadata-store.md.
  DATABASE_URL = "/app/data/chat_metadata.db"
  # botsapp-waha's Fly 6PN internal DNS name — private networking only,
  # never a public URL. Update if the waha app is ever named differently.
  WAHA_URL = "http://botsapp-waha.internal:3000"
  WAHA_SESSION = "default"
  # REQUIRED: the first admin's email (docs/decisions/0025). Owns the primary
  # WhatsApp account. Left empty, nothing is visible to the MCP server.
  BOTSAPP_ADMIN_EMAIL = ""
  # Admin UI login (docs/decisions/0026). It refuses to start without the login
  # settings (WORKOS_CLIENT_ID, WORKOS_API_KEY, BOTSAPP_SESSION_SECRET as
  # `fly secrets`; ADMIN_BASE_URL, optionally WORKOS_ORG_ID, here). start.sh
  # backgrounds the admin UI, so a refusal to start is silent to Fly's health
  # checks: check `fly logs`.
  # The path admin-ui's routes, redirects and templates are all built under
  # (docs/decisions/0028) — must match server/Caddyfile's /admin/* handler,
  # which forwards the path unstripped. Empty for direct access (local dev,
  # `fly proxy`); set here because Fly's deploy fronts both processes behind
  # Caddy on one port.
  ADMIN_URL_PREFIX = "/admin"
  # Scoped WAHA keys (docs/decisions/0027, 0030). BOTSAPP_SECRET_KEY, the master key
  # that encrypts the stored keys, is a `fly secrets` value, never set here. Both
  # processes need it; every account needs a key (created on the Session page), and
  # start.sh withholds WAHA_API_KEY from the MCP process.
  LOG_LEVEL = "INFO"
  # FastMCP's default logger uses rich, which word-wraps to a fixed console
  # width even when stderr isn't a TTY — on Fly this chops a single log
  # statement (e.g. workos.py's "AuthKit tokens will be validated..." line)
  # into several physical lines, which Fly's log collector then shows as
  # separate, out-of-order log entries. Plain logging keeps each record on
  # one line.
  FASTMCP_ENABLE_RICH_LOGGING = "false"
  # This app's own public URL — must match whatever `fly apps create`
  # actually names it (https://<app-name>.fly.dev).
  MCP_BASE_URL = "https://botsapp.fly.dev"
  # Not secret (it's already exposed via the public OAuth discovery
  # endpoint) — WAHA_API_KEY, and (if voice-note transcription is wanted —
  # see .env.example) OPENAI_API_KEY are the ones that go through
  # `fly secrets set` instead, never here. There's no ALLOWED_EMAILS to set
  # either way — the email allowlist lives in the DB now, managed from the
  # admin UI's Users page. See docs/decisions/0015 and 0026.
  WORKOS_AUTHKIT_DOMAIN = ""
