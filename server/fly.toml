# Fly app for mcp-server + admin-ui — see docs/decisions/0013. Both run as
# separate processes inside this one Machine (server/start.sh), sharing the
# two volumes below; only port 8000 (mcp-server) is ever declared as a
# public service, so port 8100 (admin-ui) stays reachable only over Fly's
# private 6PN networking / `fly proxy`, never the public internet.
#
# App name/region are placeholders — set at `fly launch`/`fly apps create`
# time; `app` here must match whatever name actually got created.
app = "botsapp"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "./start.sh"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "botsapp_data"
  destination = "/app/data"
  initial_size = "1gb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]

[env]
  # DATABASE_URL points at the mount above — same path docker-compose.yml
  # already uses locally. There's no MEDIA_DIR: get_media() fetches media
  # straight from WAHA (which keeps its own persistent copy) rather than
  # caching it locally — see docs/decisions/0007-sqlite-for-metadata-store.md.
  DATABASE_URL = "/app/data/chat_metadata.db"
  # botsapp-waha's Fly 6PN internal DNS name — private networking only,
  # never a public URL. Update if the waha app is ever named differently.
  WAHA_URL = "http://botsapp-waha.internal:3000"
  WAHA_SESSION = "default"
  # REQUIRED: the first admin's email (docs/decisions/0025). Owns the primary
  # WhatsApp account; the pre-multi-tenancy allowlist/tags are adopted into it
  # on first start. Left empty, nothing is visible to the MCP server.
  BOTSAPP_ADMIN_EMAIL = ""
  # Admin UI login (docs/decisions/0026). It refuses to start without either the
  # login settings (WORKOS_CLIENT_ID, WORKOS_API_KEY, BOTSAPP_SESSION_SECRET as
  # `fly secrets`; ADMIN_BASE_URL, optionally WORKOS_ORG_ID, here) or an explicit
  # opt-out. Until login is configured and verified against live WorkOS, keep the
  # admin UI private and set ADMIN_DISABLE_AUTH = "true" — it affects the admin UI
  # only (unlike LOCAL_DEV_DISABLE_AUTH, which would also open the MCP server).
  # Note start.sh backgrounds the admin UI, so a refusal to start is silent to
  # Fly's health checks: check `fly logs` after deploying.
  ADMIN_DISABLE_AUTH = "true"
  LOG_LEVEL = "INFO"
  # This app's own public URL — must match whatever `fly apps create`
  # actually names it (https://<app-name>.fly.dev).
  MCP_BASE_URL = "https://botsapp.fly.dev"
  # Not secret (it's already exposed via the public OAuth discovery
  # endpoint) — WAHA_API_KEY, and (if voice-note transcription is wanted —
  # see .env.example) OPENAI_API_KEY are the ones that go through
  # `fly secrets set` instead, never here. There's no ALLOWED_EMAILS to set
  # either way — the email allowlist lives in the DB now, managed from the
  # admin UI's Users page. See docs/decisions/0015 and 0026.
  WORKOS_AUTHKIT_DOMAIN = ""
