name: Renovate

on:
  schedule:
    # Daily; the config's own schedule decides when PRs actually open.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no branches/PRs; logs what would change)"
        type: boolean
        default: false
      log_level:
        description: "Renovate log level"
        type: choice
        options: [info, debug]
        default: info
  # A tick on the dashboard issue's checkboxes re-runs Renovate immediately.
  issues:
    types: [edited]
  push:
    branches: [main]
    paths:
      - .github/renovate.json5
  pull_request:
    paths:
      - .github/renovate.json5
      - .github/workflows/renovate.yml

permissions:
  contents: read

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate config
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: renovate-config-validator
        run: npx --yes --package renovate -- renovate-config-validator --strict

  renovate:
    name: run renovate
    # Only on the main repo, and only for the dashboard issue's own edits.
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'issues' || contains(github.event.issue.title, 'Dependency Dashboard'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Needed when running on GITHUB_TOKEN (no RENOVATE_TOKEN set): branches,
    # PRs and the Dependency Dashboard issue. A PAT/App token ignores these.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7

      # Say which token mode this run is in. (Write failures fail the job via the
      # exit code: .github/renovate.json5 promotes them to error-level logs.)
      - name: Note token mode
        env:
          HAS_PAT: ${{ secrets.RENOVATE_TOKEN != '' }}
        run: |
          if [ "$HAS_PAT" = "true" ]; then
            echo "Renovate is using RENOVATE_TOKEN." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Renovate on GITHUB_TOKEN::RENOVATE_TOKEN is not set. GitHub Actions version bumps are disabled (GITHUB_TOKEN can never update workflow files), and PRs Renovate opens will not trigger CI. Also needs Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests'. See docs/decisions/0021-renovate-token-fallback.md."
            echo "Renovate is using GITHUB_TOKEN (reduced mode); see the warning annotation." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Prefer a PAT/App token (RENOVATE_TOKEN): it can update workflow files
      # and the PRs it opens trigger CI. Fall back to GITHUB_TOKEN so the
      # dashboard and non-workflow updates still work without one.
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.9
        with:
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "optional"
          # On GITHUB_TOKEN, pushing a change to .github/workflows/* is refused
          # by GitHub, so don't propose them at all.
          RENOVATE_CONFIG: >-
            ${{ secrets.RENOVATE_TOKEN == ''
            && '{"packageRules":[{"matchManagers":["github-actions"],"enabled":false}]}'
            || '{}' }}
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dry_run && 'full' || '' }}
