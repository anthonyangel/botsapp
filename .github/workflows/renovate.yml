name: Renovate

on:
  schedule:
    # Daily; the config's own schedule decides when PRs actually open.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no branches/PRs; logs what would change)"
        type: boolean
        default: false
      log_level:
        description: "Renovate log level"
        type: choice
        options: [info, debug]
        default: info
  # A tick on the dashboard issue's checkboxes re-runs Renovate immediately.
  issues:
    types: [edited]
  push:
    branches: [main]
    paths:
      - .github/renovate.json5
  pull_request:
    paths:
      - .github/renovate.json5
      - .github/workflows/renovate.yml

permissions:
  contents: read

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate config
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: renovate-config-validator
        run: npx --yes --package renovate -- renovate-config-validator --strict

  renovate:
    name: run renovate
    # Only on the main repo, and only for the dashboard issue's own edits.
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'issues' || contains(github.event.issue.title, 'Dependency Dashboard'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "optional"
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dry_run && 'full' || '' }}
