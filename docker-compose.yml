# Shared by mcp-server and admin-ui below via the `<<: *bridge-env` merge
# key — both processes must agree on bridge/db config, so it's declared
# once here instead of twice.
x-bridge-env: &bridge-env
  DATABASE_URL: /app/data/chat_metadata.db
  WAHA_URL: http://waha:3000
  WAHA_API_KEY: ${WAHA_API_KEY:-}
  WAHA_SESSION: ${WAHA_SESSION:-default}
  BOTSAPP_ADMIN_EMAIL: ${BOTSAPP_ADMIN_EMAIL:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TZ: Asia/Jerusalem

services:
  waha:
    # NOWEB engine, same as Fly (docs/decisions/0023), so local and production
    # behave alike. `noweb-arm-<version>` is the arm64 (Apple Silicon) build of the
    # NOWEB-only image: no Chromium, so no shm_size needed. Override WAHA_IMAGE with
    # `devlikeapro/waha:noweb-<version>` on x86_64 hosts. Version-pinned on purpose
    # (not `dev-arm`); Renovate bumps it. Switching an existing local volume from the
    # old WEBJS setup needs the old `default` session deleted and the QR re-scanned.
    image: ${WAHA_IMAGE:-devlikeapro/waha:noweb-arm-2026.9.2}
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      # Tracks WhatsApp's current web version automatically (same as waha/fly.toml).
      WAHA_NOWEB_WA_VERSION: auto-web
      WAHA_API_KEY: ${WAHA_API_KEY}
      # Local-file media storage (WAHA's own default). The actual WAHA
      # default is a 180-second lifetime, which silently deletes received
      # media before get_media() has any real chance of being called for
      # it, so this bumps it instead of leaving it unset. Postgres/S3 are
      # WAHA's other media-storage options; local files stay right for
      # this deployment (family-scale, single host, same reasoning as the
      # metadata store).
      #
      # 7 days, in seconds — was "0" (never expire) until that unbounded
      # growth filled the deployed Fly volume and caused an ENOSPC outage;
      # see docs/decisions/0016 (supersedes the media half of 0007). Kept
      # in sync with waha/fly.toml's value rather than letting local dev
      # and production disagree on retention.
      WHATSAPP_FILES_FOLDER: /app/.media
      WHATSAPP_FILES_LIFETIME: "604800"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    # Loopback-only: this is WAHA's own REST API. It should never be
    # reachable from outside this machine, even in local dev.
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - whatsapp-network
    restart: unless-stopped

  mcp-server:
    # The only service meant to be reachable beyond this machine — its own
    # public Fly app once deployed, gated by AuthKit login. Still
    # loopback-only here for local dev.
    build: ./server
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # DATABASE_URL (in x-bridge-env above) is a SQLite file path, shared
      # with admin-ui via the metadata-data volume below (same file, both
      # processes, WAL mode handles the concurrent access).
      <<: *bridge-env
      WORKOS_AUTHKIT_DOMAIN: ${WORKOS_AUTHKIT_DOMAIN}
      MCP_BASE_URL: ${MCP_BASE_URL:-http://localhost:8000}
      # No ALLOWED_EMAILS here — the email allowlist lives in the DB, set
      # via the admin UI's Access tab. See
      # docs/decisions/0015-email-allowlist-in-db.md.
      LOCAL_DEV_DISABLE_AUTH: ${LOCAL_DEV_DISABLE_AUTH:-}
      # Optional — voice-note transcription only, see .env.example.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - metadata-data:/app/data
    depends_on:
      waha:
        condition: service_started
    networks:
      - whatsapp-network
    restart: unless-stopped

  admin-ui:
    # Behind an AuthKit login (docs/decisions/0026, admin/auth.py) unless
    # LOCAL_DEV_DISABLE_AUTH/ADMIN_DISABLE_AUTH is set. The login has not been
    # exercised against a live WorkOS environment yet, so keep this loopback-
    # only and off any public Fly service until it has. Same image as
    # mcp-server, different entrypoint.
    build: ./server
    command: ["uv", "run", "uvicorn", "botsapp.admin_main:app", "--host", "0.0.0.0", "--port", "8100"]
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      <<: *bridge-env
      LOCAL_DEV_DISABLE_AUTH: ${LOCAL_DEV_DISABLE_AUTH:-}
      ADMIN_DISABLE_AUTH: ${ADMIN_DISABLE_AUTH:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_ORG_ID: ${WORKOS_ORG_ID:-}
      ADMIN_BASE_URL: ${ADMIN_BASE_URL:-http://localhost:8100}
      BOTSAPP_SESSION_SECRET: ${BOTSAPP_SESSION_SECRET:-}
    volumes:
      - metadata-data:/app/data
    depends_on:
      waha:
        condition: service_started
    networks:
      - whatsapp-network
    restart: unless-stopped

volumes:
  waha-data:
  waha-media:
  metadata-data:

networks:
  whatsapp-network:
    driver: bridge
