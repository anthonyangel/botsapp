# Fly app for the WAHA bridge — see docs/decisions/0010/0013. No
# [http_service] or [[services]] block at all, deliberately: this app must
# never be reachable beyond Fly's private 6PN networking (reached from
# botsapp as http://botsapp-waha.internal:3000) / `fly proxy` from a laptop.
#
# App name is a placeholder — set at `fly apps create` time; `app` here
# must match whatever name actually got created, and server/fly.toml's
# WAHA_URL must be updated to match if it's ever renamed.
app = "botsapp-waha"
primary_region = "fra"

[build]
  # NOT dev-arm here: that tag is arm64-only (Apple Silicon, for local
  # Compose — see docs/decisions/0007's note and docker-compose.yml's
  # WAHA_IMAGE override), and Fly Machines default to amd64. Confirmed by
  # a real deploy failure ("does not support amd64 architecture for linux
  # os") before landing on this tag — the arm-tag QR-pairing bug that note
  # describes is specific to the `arm` tag, not this one.
  image = "devlikeapro/waha:dev"

[[mounts]]
  # One volume, not two: a Fly Machine only supports a single volume mount
  # (confirmed by a real deploy failure — "invalid config.mounts, only 1
  # volume supported"). Sessions and media both live under this one mount
  # instead, in their own subdirectories — WAHA supports overriding the
  # session-store base dir for exactly this kind of case (see
  # WAHA_LOCAL_STORE_BASE_DIR below), it's not hardcoded to /app/.sessions.
  source = "waha_data"
  destination = "/app/data"
  # Was 1gb — filled to 100% and started throwing ENOSPC (see
  # docs/decisions/0016). This value only takes effect at volume-creation
  # time; the already-created live volume was resized separately via
  # `fly volumes extend`, not by editing this file.
  initial_size = "5gb"

[[vm]]
  # Was shared-cpu-2x/2gb, sized for WEBJS's headless Chromium. Downsized
  # 2026-09-17 while the engine is NOWEB (no browser — see WHATSAPP_DEFAULT_ENGINE
  # below): live usage on the 2gb machine was ~460MB idle. If WEBJS ever comes
  # back, size this up again first — NOWEB's usage doesn't need to hold once
  # Chromium is back in the picture.
  size = "shared-cpu-1x"
  memory = "1gb"

[env]
  # TEMPORARY DIAGNOSTIC SWAP (2026-09-09): was WEBJS. On this Fly machine
  # WEBJS's headless Chromium could not reliably load web.whatsapp.com —
  # every session start/restart hit `TimeoutError: Waiting failed: 30000ms
  # exceeded` or `Navigating frame was detached`, looping forever and never
  # producing a stable QR/pairing state. Trying NOWEB (no browser, talks the
  # WhatsApp Web protocol directly) to see if it's specific to WEBJS/Chromium
  # on this host, or a network-path problem that would hit NOWEB too.
  #
  # Caveat (see docker-compose.yml's WEBJS comment, which this contradicts
  # for now): NOWEB/GOWS are protocol reimplementations previously avoided
  # because they hit `companion_reg_refresh`-class upstream WhatsApp
  # breakage that WEBJS sidesteps by driving the real site. If NOWEB fails
  # here too, that's likely why — not a new bug. If NOWEB turns out to be
  # the stable choice, promote this to a real docs/decisions/ record
  # (superseding that comment) instead of leaving it as a fly.toml note.
  WHATSAPP_DEFAULT_ENGINE = "NOWEB"
  # Recommended for NOWEB per WAHA's docs — tracks WhatsApp's current web
  # version automatically instead of pinning one that goes stale.
  WAHA_NOWEB_WA_VERSION = "auto-web"
  WAHA_LOCAL_STORE_BASE_DIR = "/app/data/sessions"
  WHATSAPP_FILES_FOLDER = "/app/data/media"
  # 7 days, in seconds — was "0" (never expire), which is what actually
  # filled the volume and caused the ENOSPC outage this bounds. See
  # docs/decisions/0016 (supersedes the media half of 0007). Kept in sync
  # with docker-compose.yml's local-dev value.
  WHATSAPP_FILES_LIFETIME = "604800"
  WAHA_LOG_FORMAT = "JSON"
  WAHA_HTTP_LOG_LEVEL = "warn"
  WAHA_PRINT_QR = "false"
  # WAHA_API_KEY goes through `fly secrets set`, never here.
